models:
  - name: int_orders_enriched
    description: >
      One row per live order with its customer, aggregates of live items and payments, and the
      processing times of the order, its items (deleted ones too) and payments.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: int_daily_sales
    description: >
      mart_daily_sales computed over every date, as a view: the full recompute that the mart
      filters and that its test compares against.
    data_tests:
      - unique_combination:
          arguments:
            columns: [purchase_date, seller_state]
