# Skeleton, week 0. Image tags pinned on 2026-09-19 from official sources; W1-T02 runs
# `docker compose pull`, fixes whatever does not resolve and records it in DECISIONS.md.
# Lines marked TODO(W1) / TODO(W3) / TODO(W4) are filled by the corresponding roadmap task.
# Rules: every service has profiles and log rotation, and every published port is bound to
# ${BIND_IP} (required: compose refuses to start with it empty). A long-running service also has
# a healthcheck, restart: unless-stopped and a memory limit. Exceptions: kafka-ui has no
# healthcheck; the one-shot jobs minio-init, lakekeeper-migrate, lakekeeper-bootstrap and
# spark-silver have no healthcheck and no restart (restart: "no", minio-init the default), and
# minio-init has no memory limit.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging

networks:
  lake:
    driver: bridge

volumes:
  postgres_oltp: {}
  postgres_meta: {}
  kafka: {}
  minio: {}
  prometheus: {}
  grafana: {}
  superset: {}

services:

  # ---------------------------------------------------------------- core
  postgres-oltp:
    <<: *common
    image: postgres:17
    profiles: [core]
    command: >
      postgres -c wal_level=logical -c max_wal_senders=4 -c max_replication_slots=4
               -c shared_buffers=128MB -c max_wal_size=1GB
    environment:
      POSTGRES_DB: ${OLTP_DB}
      POSTGRES_USER: ${OLTP_USER}
      POSTGRES_PASSWORD: ${OLTP_PASSWORD}
      DEBEZIUM_USER: ${DEBEZIUM_USER}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
    volumes:
      - postgres_oltp:/var/lib/postgresql/data
      - ../oltp/init:/docker-entrypoint-initdb.d:ro   # TODO(W1): creates debezium role + publication
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_USER} -d ${OLTP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [lake]

  kafka:
    <<: *common
    image: apache/kafka:4.3.1
    profiles: [core]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS}
      KAFKA_LOG_RETENTION_BYTES: 2147483648
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics created explicitly by connect/register.sh
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP}
      # The image defaults log.dirs to /tmp/kraft-combined-logs, which the volume below does not cover.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka:/var/lib/kafka/data
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:9092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1280M
    networks: [lake]

  kafka-connect:
    <<: *common
    build:
      context: ./connect   # quay.io/debezium/connect:3.5 + JMX exporter agent (W4-D1)
    image: lakehouse/connect:dev
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
      postgres-oltp:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-lakehouse
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_HEAP_OPTS: ${CONNECT_HEAP}
      # Metrics on :9404 inside the network only; rules in docker/connect/metrics.yaml.
      ENABLE_JMX_EXPORTER: "true"
      # Debezium publishes pg_logical_emit_message records to oltp.message: the 4 MB padding of
      # chaos 6 (23.10) stopped CDC at 1 MB. Kept so a message that size cannot stop it again.
      CONNECT_PRODUCER_MAX_REQUEST_SIZE: "8388608"
    volumes:
      # /kafka/config is an anonymous volume of the base image: a recreated container keeps the
      # old one, which hides the file the image layer adds, and the agent stops the JVM.
      - ./connect/metrics.yaml:/kafka/config/metrics.yaml:ro
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M
    networks: [lake]

  minio:
    <<: *common
    # ADR-026: the last community release, built from the source of its tag (no registry serves
    # it any more). The runtime is alpine, which has wget and no curl.
    build:
      context: ./minio
      target: minio
    image: lakehouse/minio:RELEASE.2025-09-07T16-13-09Z
    # Never pulled: `lakehouse` on Docker Hub is somebody else's namespace, and with the image
    # absent (a clean clone) compose would try the registry before it builds.
    pull_policy: never
    profiles: [core]
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio:/data
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [lake]

  minio-init:
    # Creates the bucket and the warehouse prefix; built with minio from the same Dockerfile (ADR-026).
    build:
      context: ./minio
      target: mc
    image: lakehouse/mc:RELEASE.2025-08-13T08-35-41Z
    pull_policy: never
    profiles: [core]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/create-bucket.sh"]
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./minio:/init:ro
    logging: *logging
    networks: [lake]

  # ADR-005: Lakekeeper, the Iceberg REST catalog of Spark and Trino. The JDBC catalog in
  # postgres-meta is kept as the rollback point (docs/runbooks/catalog-cutover.md).
  # Pinned by digest: a newer image migrates the schema on start and the old one then refuses it,
  # so there is no image rollback.
  # One-shot schema migration of the lakekeeper database; the exit code is the signal.
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.6@sha256:d6829722cac0d00dfc5665b0955766387b93ccadd8b1e70e679b49619bc30ea5
    profiles: [core]
    depends_on:
      postgres-meta:
        condition: service_healthy
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${META_USER}:${META_PASSWORD}@postgres-meta:5432/${LAKEKEEPER_DB}
      # Encrypts the warehouse S3 keys stored in that database. Never change it once a warehouse exists.
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?add it to .env per OPERATIONS.md; make secrets skips an existing .env}
    restart: "no"
    healthcheck:
      disable: true
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [lake]

  lakekeeper:
    <<: *common
    image: quay.io/lakekeeper/catalog:v0.13.6@sha256:d6829722cac0d00dfc5665b0955766387b93ccadd8b1e70e679b49619bc30ea5
    profiles: [core]
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:8181:8181"
    healthcheck:
      # Distroless image: no shell, no curl. The binary checks its own /health.
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [lake]

  # One-shot: bootstrap the server and create the warehouse; a re-run changes nothing. Spark and
  # Trino wait for it, so it runs on every `up` of them; `make lakekeeper-bootstrap` runs it alone.
  # The Spark image already has bash, curl and python3.
  lakekeeper-bootstrap:
    image: lakehouse/spark:dev   # built by spark-bronze
    # A local tag only: compose must not pull a lakehouse/spark:dev from Docker Hub.
    pull_policy: never
    profiles: [core]
    depends_on:
      lakekeeper:
        condition: service_healthy
    entrypoint: ["bash", "/scripts/bootstrap.sh"]
    environment:
      LAKEKEEPER_API: http://lakekeeper:8181
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ../scripts/lakekeeper:/scripts:ro
    restart: "no"
    healthcheck:
      disable: true
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [lake]

  spark-bronze:
    <<: *common
    build:
      context: ../streaming
      dockerfile: Dockerfile   # apache/spark:3.5.9-java17-python3 + iceberg 1.11.0 + kafka + s3a
      additional_contexts:
        contracts: ../contracts
    image: lakehouse/spark:dev
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
      postgres-meta:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    command: ["bronze_cdc_ingest"]   # run-job.sh spark-submits spark_jobs/<name>.py
    environment:
      SPARK_MASTER: ${SPARK_MASTER}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY}
      KAFKA_BOOTSTRAP: kafka:9092
      CATALOG_TYPE: ${CATALOG_TYPE}   # rest; jdbc only through docs/runbooks/catalog-cutover.md
      # CATALOG_JDBC_* and CATALOG_WAREHOUSE serve CATALOG_TYPE=jdbc only: kept for the rollback.
      CATALOG_JDBC_URL: jdbc:postgresql://postgres-meta:5432/${CATALOG_DB}
      CATALOG_JDBC_USER: ${META_USER}
      CATALOG_JDBC_PASSWORD: ${META_PASSWORD}
      CATALOG_WAREHOUSE: s3a://${S3_BUCKET}/warehouse
      CHECKPOINT_ROOT: s3a://${S3_BUCKET}/checkpoints
      LAKEKEEPER_URI: ${LAKEKEEPER_URI}
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BRONZE_TRIGGER_SECONDS: ${BRONZE_TRIGGER_SECONDS}
      BRONZE_MAX_OFFSETS_PER_TRIGGER: ${BRONZE_MAX_OFFSETS_PER_TRIGGER}
      METRICS_PORT: "4041"
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:4040:4040"
      - "${BIND_IP:?set BIND_IP in .env}:4041:4041"
    healthcheck:
      # Healthy while the query reported progress or idleness in the last 120 s. Idle events come
      # every 10-20 s on a quiet topic; a query stuck in commit retries stops them.
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:4041/metrics | awk -v now=$$(date +%s)
          '/^spark_streaming_last_batch_timestamp/ && now - $$2 < 120 {ok=1} END {exit !ok}'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2560M
    networks: [lake]

  # Stateful job (W5-T01b, ADR-024): distinct new orders per minute with a 5 minute watermark, from
  # Kafka into silver.orders_per_minute. A service of its own so that its failure or OOM kill does
  # not take CDC ingest down with it. The image is built by spark-bronze; `core` is not a
  # dependency of the profile (required: false), like the obs exporters.
  spark-orders-per-minute:
    <<: *common
    image: lakehouse/spark:dev
    pull_policy: never
    profiles: [stateful]
    depends_on:
      kafka:
        condition: service_healthy
        required: false
      lakekeeper-bootstrap:
        condition: service_completed_successfully
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    command: ["orders_per_minute"]
    environment:
      SPARK_MASTER: ${SPARK_MASTER}
      SPARK_DRIVER_MEMORY: 1g
      KAFKA_BOOTSTRAP: kafka:9092
      CATALOG_TYPE: ${CATALOG_TYPE}
      CATALOG_JDBC_URL: jdbc:postgresql://postgres-meta:5432/${CATALOG_DB}
      CATALOG_JDBC_USER: ${META_USER}
      CATALOG_JDBC_PASSWORD: ${META_PASSWORD}
      CATALOG_WAREHOUSE: s3a://${S3_BUCKET}/warehouse
      CHECKPOINT_ROOT: s3a://${S3_BUCKET}/checkpoints
      LAKEKEEPER_URI: ${LAKEKEEPER_URI}
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BRONZE_MAX_OFFSETS_PER_TRIGGER: ${BRONZE_MAX_OFFSETS_PER_TRIGGER}
      OPM_WATERMARK: ${OPM_WATERMARK:-5 minutes}
      OPM_TRIGGER_SECONDS: ${OPM_TRIGGER_SECONDS:-20}
      OPM_SHUFFLE_PARTITIONS: ${OPM_SHUFFLE_PARTITIONS:-2}
      METRICS_PORT: "4041"
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:4043:4040"   # Spark UI
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:4041/metrics | awk -v now=$$(date +%s)
          '/^spark_streaming_last_batch_timestamp/ && now - $$2 < 120 {ok=1} END {exit !ok}'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1792M
    networks: [lake]

  # One-shot: AvailableNow reads what bronze committed since the last run, merges it, exits.
  # `make silver` runs it by hand; Airflow schedules it from week 3. The exit code is the health
  # signal and a restart policy would loop it, so it has neither (same as minio-init).
  # `make silver` uses --no-deps, so Lakekeeper must already run (spark-bronze's up starts it).
  spark-silver:
    image: lakehouse/spark:dev   # built by spark-bronze
    # A local tag only: compose must not pull a lakehouse/spark:dev from Docker Hub.
    pull_policy: never
    profiles: [jobs]
    depends_on:
      postgres-meta:
        condition: service_healthy
      minio:
        condition: service_healthy
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    command: ["silver_upsert"]
    environment:
      SPARK_MASTER: ${SPARK_MASTER}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY}
      CATALOG_TYPE: ${CATALOG_TYPE}
      CATALOG_JDBC_URL: jdbc:postgresql://postgres-meta:5432/${CATALOG_DB}
      CATALOG_JDBC_USER: ${META_USER}
      CATALOG_JDBC_PASSWORD: ${META_PASSWORD}
      CATALOG_WAREHOUSE: s3a://${S3_BUCKET}/warehouse
      CHECKPOINT_ROOT: s3a://${S3_BUCKET}/checkpoints
      LAKEKEEPER_URI: ${LAKEKEEPER_URI}
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:4042:4040"   # Spark UI while the run lasts
    restart: "no"
    healthcheck:
      disable: true
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 2048M
    networks: [lake]

  oltp-replayer:
    <<: *common
    build:
      context: ../oltp
    image: lakehouse/replayer:dev
    profiles: [core]
    depends_on:
      postgres-oltp:
        condition: service_healthy
    environment:
      OLTP_DSN: postgresql://${OLTP_USER}:${OLTP_PASSWORD}@postgres-oltp:5432/${OLTP_DB}
      REPLAY_SPEED: ${REPLAY_SPEED}
      REPLAY_INITIAL_SHARE: ${REPLAY_INITIAL_SHARE}
      REPLAY_LATE_RATIO: ${REPLAY_LATE_RATIO}
      REPLAY_LATE_DELAY_SECONDS: ${REPLAY_LATE_DELAY_SECONDS}
      REPLAY_DUPLICATE_RATIO: ${REPLAY_DUPLICATE_RATIO}
      REPLAY_SCHEMA_EVOLUTION_AT: ${REPLAY_SCHEMA_EVOLUTION_AT}
      DATA_DIR: /data
    volumes:
      - ${DATA_DIR}:/data:ro
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:8000:8000"   # /metrics, /status
    healthcheck:
      # python:3.12-slim has no curl; urlopen raises on a refused connection or an HTTP error.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [lake]

  # ---------------------------------------------------------------- query
  trino:
    <<: *common
    image: trinodb/trino:483
    profiles: [query]
    depends_on:
      postgres-meta:
        condition: service_healthy
      minio:
        condition: service_healthy
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    # jvm.config cannot read the environment, so the heap goes to the launcher as a JVM option.
    command: ["/usr/lib/trino/bin/run-trino", "-J-Xmx${TRINO_XMX:?TRINO_XMX must be set}"]
    environment:
      # glibc gives each busy thread a malloc arena of up to 64 MB; with hundreds of Trino threads
      # that grew RSS about 0.55 GiB past what the JVM tracks (NMT, 2026-10-18, D20).
      MALLOC_ARENA_MAX: "4"
      # CATALOG_DB, META_* and S3_BUCKET serve only the JDBC lake.properties of the rollback.
      CATALOG_DB: ${CATALOG_DB}
      META_USER: ${META_USER}
      META_PASSWORD: ${META_PASSWORD}
      LAKEKEEPER_URI: ${LAKEKEEPER_URI}
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      # catalog/lake.properties is Lakekeeper, the catalog Spark writes. Trino reads catalog files
      # only at startup: an edit there needs `docker restart lakehouse-trino-1`.
      - ./trino/etc:/etc/trino:ro
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:8080:8080"
    healthcheck:
      # Ships with the image: /v1/info answers and reports "starting": false.
      test: ["CMD-SHELL", "/usr/lib/trino/bin/health-check"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3584M
    networks: [lake]

  # ---------------------------------------------------------------- orchestrate
  postgres-meta:
    <<: *common
    image: postgres:17
    profiles: [core, orchestrate, bi]   # core: lakekeeper's database and the JDBC rollback catalog
    environment:
      POSTGRES_USER: ${META_USER}
      POSTGRES_PASSWORD: ${META_PASSWORD}
      POSTGRES_DB: ${META_USER}
    volumes:
      - postgres_meta:/var/lib/postgresql/data
      - ./postgres-meta/init:/docker-entrypoint-initdb.d:ro   # creates iceberg_catalog, airflow, lakekeeper, superset databases
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${META_USER}"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [lake]

  airflow-api-server:
    <<: *common
    build:
      context: ../airflow   # apache/airflow:3.3.2 + dbt-trino + docker provider
    image: lakehouse/airflow:dev
    profiles: [orchestrate]
    depends_on:
      postgres-meta:
        condition: service_healthy
    command: api-server
    env_file: ./airflow/airflow.env
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../dbt:/opt/dbt:ro
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/monitor/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 700M
    networks: [lake]

  airflow-scheduler:
    <<: *common
    image: lakehouse/airflow:dev
    profiles: [orchestrate]
    depends_on:
      airflow-api-server:
        condition: service_healthy
    command: scheduler
    env_file: ./airflow/airflow.env
    # Tasks run here (LocalExecutor), DockerOperator among them: the socket's group, root on the
    # host in effect (ADR-011).
    group_add: ["${DOCKER_GID:-0}"]
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../dbt:/opt/dbt:ro
      # Only the scheduler runs tasks: the api-server has no socket (every UI visitor is admin).
      - /var/run/docker.sock:/var/run/docker.sock   # DockerOperator launches spark-silver
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 900M
    networks: [lake]

  airflow-dag-processor:
    <<: *common
    image: lakehouse/airflow:dev
    profiles: [orchestrate]
    depends_on:
      airflow-api-server:
        condition: service_healthy
    command: dag-processor
    env_file: ./airflow/airflow.env
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 500M
    networks: [lake]

  # ---------------------------------------------------------------- obs
  prometheus:
    <<: *common
    image: prom/prometheus:v3.14.0
    profiles: [obs]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      # Rules reload on SIGHUP, not on file change: `docker exec lakehouse-prometheus-1 kill -HUP 1`.
      # Never `docker kill -s HUP`: it marks a manual stop and unless-stopped then skips the container.
      - ../observability/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
    networks: [lake]

  grafana:
    <<: *common
    image: grafana/grafana:13.2.2
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Installed from the Grafana catalog on start into the grafana volume (W6-D11), synchronously:
      # provisioning reads the datasource file before an async install is done. Pinned: an unpinned
      # id moves to the newest release on every start.
      GF_PLUGINS_PREINSTALL_SYNC: trino-datasource@1.4.1
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # 256M before the Trino plugin; it runs as its own Go process beside Grafana (W6-D11).
          memory: 384M
    networks: [lake]

  kafka-exporter:
    <<: *common
    image: danielqsj/kafka-exporter:v1.10.0   # verified 2026-10-19
    profiles: [obs]
    # Pinned to the newest protocol sarama knows; 2.0.0 (default) also reads broker 4.3.1 (2026-10-19).
    command: ["--kafka.server=kafka:9092", "--kafka.version=4.0.0"]
    # Without `required: false` a profile-obs service depending on a profile-core one makes the
    # project invalid under `make up PROFILE=obs`.
    depends_on:
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/metrics | grep -q '^kafka_brokers [1-9]'"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [lake]

  postgres-exporter:
    <<: *common
    image: prometheuscommunity/postgres-exporter:v0.17.1   # verified 2026-10-19
    profiles: [obs]
    environment:
      DATA_SOURCE_NAME: postgresql://${OLTP_USER}:${OLTP_PASSWORD}@postgres-oltp:5432/${OLTP_DB}?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /queries.yaml   # replication slot retained WAL
    volumes:
      - ../observability/postgres-exporter/queries.yaml:/queries.yaml:ro
    depends_on:
      postgres-oltp:
        condition: service_healthy
        required: false
    healthcheck:
      # /metrics answers 200 with the database down; pg_up says whether the exporter got in.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics | grep -q '^pg_up 1'"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [lake]

  statsd-exporter:
    <<: *common
    image: prom/statsd-exporter:v0.28.0   # verified 2026-10-19; Airflow and dq_checks metrics
    profiles: [obs]
    volumes:
      - ../observability/statsd/mapping.yml:/tmp/mapping.yml:ro
    command: ["--statsd.mapping-config=/tmp/mapping.yml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9102/-/healthy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [lake]

  # cAdvisor cannot name containers on Docker Desktop with the containerd image store (2026-10-19,
  # v0.52.1 and v0.55.1): this reads the Docker API instead (ADR-023).
  container-exporter:
    <<: *common
    build:
      context: ../observability/container-exporter
    image: lakehouse/container-exporter:dev
    profiles: [obs]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-lakehouse}
    # Only GET requests, but the socket is root on the host in effect, as for the scheduler.
    group_add: ["${DOCKER_GID:-0}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9105/metrics', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [lake]

  # ---------------------------------------------------------------- bi
  superset:
    <<: *common
    image: apache/superset:6.1.0   # TODO(W6): tags are not semver on Docker Hub, pin by digest
    profiles: [bi]
    depends_on:
      postgres-meta:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - superset:/app/superset_home
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1280M
    networks: [lake]

  # ---------------------------------------------------------------- tools
  kafka-ui:
    <<: *common
    image: ghcr.io/kafbat/kafka-ui:v1.3.0   # TODO: verify tag when first used
    profiles: [tools]
    environment:
      KAFKA_CLUSTERS_0_NAME: lakehouse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "${BIND_IP:?set BIND_IP in .env}:8085:8080"
    deploy:
      resources:
        limits:
          memory: 400M
    networks: [lake]
