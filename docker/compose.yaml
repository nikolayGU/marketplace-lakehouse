# Skeleton, week 0. Image tags pinned on 2026-09-19 from official sources; W1-T02 runs
# `docker compose pull`, fixes whatever does not resolve and records it in DECISIONS.md.
# Lines marked TODO(W1) / TODO(W3) / TODO(W4) are filled by the corresponding roadmap task.
# Rules: every service has profiles, healthcheck, restart, logging, memory limit,
# ports only on ${BIND_IP}.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging

networks:
  lake:
    driver: bridge

volumes:
  postgres_oltp: {}
  postgres_meta: {}
  kafka: {}
  minio: {}
  prometheus: {}
  grafana: {}
  superset: {}

services:

  # ---------------------------------------------------------------- core
  postgres-oltp:
    <<: *common
    image: postgres:17
    profiles: [core]
    command: >
      postgres -c wal_level=logical -c max_wal_senders=4 -c max_replication_slots=4
               -c shared_buffers=128MB -c max_wal_size=1GB
    environment:
      POSTGRES_DB: ${OLTP_DB}
      POSTGRES_USER: ${OLTP_USER}
      POSTGRES_PASSWORD: ${OLTP_PASSWORD}
      DEBEZIUM_USER: ${DEBEZIUM_USER}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
    volumes:
      - postgres_oltp:/var/lib/postgresql/data
      - ../oltp/init:/docker-entrypoint-initdb.d:ro   # TODO(W1): creates debezium role + publication
    ports:
      - "${BIND_IP}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_USER} -d ${OLTP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [lake]

  kafka:
    <<: *common
    image: apache/kafka:4.3.1
    profiles: [core]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS}
      KAFKA_LOG_RETENTION_BYTES: 2147483648
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics created explicitly by connect/register.sh
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP}
      # The image defaults log.dirs to /tmp/kraft-combined-logs, which the volume below does not cover.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka:/var/lib/kafka/data
    ports:
      - "${BIND_IP}:9092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1280M
    networks: [lake]

  kafka-connect:
    <<: *common
    image: quay.io/debezium/connect:3.5
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
      postgres-oltp:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-lakehouse
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_HEAP_OPTS: ${CONNECT_HEAP}
      # TODO(W4-T01): ENABLE_JMX_EXPORTER=true needs jmx_prometheus_javaagent*.jar in /kafka/libs
      # (not bundled in this image) plus config/metrics.yaml and port 9404.
    ports:
      - "${BIND_IP}:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M
    networks: [lake]

  minio:
    <<: *common
    # ADR-004: last community release, pulled from quay.io (the Docker Hub repo was removed).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [core]
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio:/data
    ports:
      - "${BIND_IP}:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [lake]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z   # creates bucket + warehouse prefix
    profiles: [core]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/create-bucket.sh"]
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./minio:/init:ro
    logging: *logging
    networks: [lake]

  # ADR-005: should-have. Week 1 uses the JDBC catalog in postgres-meta (no extra service).
  lakekeeper:
    <<: *common
    image: quay.io/lakekeeper/catalog:v0.13.1
    profiles: [rest]
    depends_on:
      postgres-meta:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["serve"]
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${META_USER}:${META_PASSWORD}@postgres-meta:5432/${LAKEKEEPER_DB}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${META_USER}:${META_PASSWORD}@postgres-meta:5432/${LAKEKEEPER_DB}
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${META_PASSWORD}
      # TODO(W1): migrate step (`migrate` command) before serve, bootstrap + warehouse creation via scripts/lakekeeper-bootstrap.sh
    ports:
      - "${BIND_IP}:8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [lake]

  spark-bronze:
    <<: *common
    build:
      context: ../streaming
      dockerfile: Dockerfile   # apache/spark:3.5.9-java17-python3 + iceberg 1.11.0 + kafka + s3a
    image: lakehouse/spark:dev
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
      postgres-meta:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["bronze_cdc_ingest"]   # run-job.sh spark-submits spark_jobs/<name>.py
    environment:
      SPARK_MASTER: ${SPARK_MASTER}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY}
      KAFKA_BOOTSTRAP: kafka:9092
      CATALOG_TYPE: ${CATALOG_TYPE}   # jdbc (week 1) | rest (after W2-T09)
      CATALOG_JDBC_URL: jdbc:postgresql://postgres-meta:5432/${CATALOG_DB}
      CATALOG_JDBC_USER: ${META_USER}
      CATALOG_JDBC_PASSWORD: ${META_PASSWORD}
      CATALOG_WAREHOUSE: s3a://${S3_BUCKET}/warehouse
      CHECKPOINT_ROOT: s3a://${S3_BUCKET}/checkpoints
      LAKEKEEPER_URI: ${LAKEKEEPER_URI}
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BRONZE_TRIGGER_SECONDS: ${BRONZE_TRIGGER_SECONDS}
      BRONZE_MAX_OFFSETS_PER_TRIGGER: ${BRONZE_MAX_OFFSETS_PER_TRIGGER}
      METRICS_PORT: "4041"
    ports:
      - "${BIND_IP}:4040:4040"
      - "${BIND_IP}:4041:4041"
    healthcheck:
      # Healthy while the query reported progress or idleness in the last 120 s. Idle events come
      # every 10-20 s on a quiet topic; a query stuck in commit retries stops them.
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:4041/metrics | awk -v now=$$(date +%s)
          '/^spark_streaming_last_batch_timestamp/ && now - $$2 < 120 {ok=1} END {exit !ok}'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2560M
    networks: [lake]

  oltp-replayer:
    <<: *common
    build:
      context: ../oltp
    image: lakehouse/replayer:dev
    profiles: [core]
    depends_on:
      postgres-oltp:
        condition: service_healthy
    environment:
      OLTP_DSN: postgresql://${OLTP_USER}:${OLTP_PASSWORD}@postgres-oltp:5432/${OLTP_DB}
      REPLAY_SPEED: ${REPLAY_SPEED}
      REPLAY_INITIAL_SHARE: ${REPLAY_INITIAL_SHARE}
      REPLAY_LATE_RATIO: ${REPLAY_LATE_RATIO}
      REPLAY_LATE_DELAY_SECONDS: ${REPLAY_LATE_DELAY_SECONDS}
      REPLAY_DUPLICATE_RATIO: ${REPLAY_DUPLICATE_RATIO}
      REPLAY_SCHEMA_EVOLUTION_AT: ${REPLAY_SCHEMA_EVOLUTION_AT}
      DATA_DIR: /data
    volumes:
      - ${DATA_DIR}:/data:ro
    ports:
      - "${BIND_IP}:8000:8000"   # /metrics, /status
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [lake]

  # ---------------------------------------------------------------- query
  trino:
    <<: *common
    image: trinodb/trino:483
    profiles: [query]
    depends_on:
      postgres-meta:
        condition: service_healthy
      minio:
        condition: service_healthy
    # jvm.config cannot read the environment, so the heap goes to the launcher as a JVM option.
    command: ["/usr/lib/trino/bin/run-trino", "-J-Xmx${TRINO_XMX:?TRINO_XMX must be set}"]
    environment:
      CATALOG_DB: ${CATALOG_DB}
      META_USER: ${META_USER}
      META_PASSWORD: ${META_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      # catalog/lake.properties reads the JDBC catalog in postgres-meta, the one Spark writes.
      - ./trino/etc:/etc/trino:ro
    ports:
      - "${BIND_IP}:8080:8080"
    healthcheck:
      # Ships with the image: /v1/info answers and reports "starting": false.
      test: ["CMD-SHELL", "/usr/lib/trino/bin/health-check"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3584M
    networks: [lake]

  # ---------------------------------------------------------------- orchestrate
  postgres-meta:
    <<: *common
    image: postgres:17
    profiles: [core, orchestrate, bi]   # core: JDBC iceberg catalog (and lakekeeper backend)
    environment:
      POSTGRES_USER: ${META_USER}
      POSTGRES_PASSWORD: ${META_PASSWORD}
      POSTGRES_DB: ${META_USER}
    volumes:
      - postgres_meta:/var/lib/postgresql/data
      - ./postgres-meta/init:/docker-entrypoint-initdb.d:ro   # creates iceberg_catalog, airflow, lakekeeper, superset databases
    ports:
      - "${BIND_IP}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${META_USER}"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [lake]

  airflow-api-server:
    <<: *common
    build:
      context: ../airflow   # apache/airflow:3.3.2 + dbt-trino + docker provider
    image: lakehouse/airflow:dev
    profiles: [orchestrate]
    depends_on:
      postgres-meta:
        condition: service_healthy
    command: api-server
    env_file: ./airflow/airflow.env   # TODO(W3): executor, db url, fernet, jwt, statsd
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../dbt:/opt/dbt:ro
      - /var/run/docker.sock:/var/run/docker.sock   # DockerOperator launches spark-silver
    ports:
      - "${BIND_IP}:8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/monitor/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 700M
    networks: [lake]

  airflow-scheduler:
    <<: *common
    image: lakehouse/airflow:dev
    profiles: [orchestrate]
    depends_on:
      airflow-api-server:
        condition: service_healthy
    command: scheduler
    env_file: ./airflow/airflow.env
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../dbt:/opt/dbt:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 600M
    networks: [lake]

  airflow-dag-processor:
    <<: *common
    image: lakehouse/airflow:dev
    profiles: [orchestrate]
    depends_on:
      airflow-api-server:
        condition: service_healthy
    command: dag-processor
    env_file: ./airflow/airflow.env
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 500M
    networks: [lake]

  # ---------------------------------------------------------------- obs
  prometheus:
    <<: *common
    image: prom/prometheus:v3.14.0
    profiles: [obs]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro   # TODO(W4): scrape configs + alert rules
      - prometheus:/prometheus
    ports:
      - "${BIND_IP}:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
    networks: [lake]

  grafana:
    <<: *common
    image: grafana/grafana:13.2.2
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro   # TODO(W4)
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "${BIND_IP}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [lake]

  kafka-exporter:
    <<: *common
    image: danielqsj/kafka-exporter:v1.10.0
    profiles: [obs]
    command: ["--kafka.server=kafka:9092"]
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [lake]

  postgres-exporter:
    <<: *common
    image: prometheuscommunity/postgres-exporter:v0.17.1   # TODO(W4): verify tag
    profiles: [obs]
    environment:
      DATA_SOURCE_NAME: postgresql://${OLTP_USER}:${OLTP_PASSWORD}@postgres-oltp:5432/${OLTP_DB}?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /queries.yaml   # replication slot retained WAL
    volumes:
      - ../observability/postgres-exporter/queries.yaml:/queries.yaml:ro
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [lake]

  statsd-exporter:
    <<: *common
    image: prom/statsd-exporter:v0.28.0   # TODO(W4): verify tag; Airflow metrics
    profiles: [obs]
    volumes:
      - ../observability/statsd/mapping.yml:/tmp/mapping.yml:ro
    command: ["--statsd.mapping-config=/tmp/mapping.yml"]
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [lake]

  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.52.1   # TODO(W4): verify tag
    profiles: [obs]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [lake]

  # ---------------------------------------------------------------- bi
  superset:
    <<: *common
    image: apache/superset:6.1.0   # TODO(W6): tags are not semver on Docker Hub, pin by digest
    profiles: [bi]
    depends_on:
      postgres-meta:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - superset:/app/superset_home
    ports:
      - "${BIND_IP}:8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1280M
    networks: [lake]

  # ---------------------------------------------------------------- tools
  kafka-ui:
    <<: *common
    image: ghcr.io/kafbat/kafka-ui:v1.3.0   # TODO: verify tag when first used
    profiles: [tools]
    environment:
      KAFKA_CLUSTERS_0_NAME: lakehouse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "${BIND_IP}:8085:8080"
    deploy:
      resources:
        limits:
          memory: 400M
    networks: [lake]
