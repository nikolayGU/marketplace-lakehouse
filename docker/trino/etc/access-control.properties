# File-based access control (W6-D17): the BI users `grafana` (datasource) and `superset` only read the marts
# (fct_*, dim_*, mart_*) of lake_ro.gold, a read-only twin of `lake`, not the dbt views over silver;
# every other client keeps the rights it had before.
# Rules: rules.json, applied when trino restarts (no security.refresh-period: a silent edit of the
# bind-mounted file would skip the restart gate).
# https://trino.io/docs/483/security/file-system-access-control.html
access-control.name=file
security.config-file=/etc/trino/rules.json
