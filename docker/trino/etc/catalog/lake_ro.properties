# W6-D17: the read-only twin of the catalog `lake` (same Lakekeeper, warehouse and S3 keys), the only
# catalog the Grafana user `grafana` may read (rules.json). File-based access control has no
# privileges for table procedures, so `ALTER TABLE ... EXECUTE expire_snapshots` or
# `remove_orphan_files` would pass on `lake` whatever the rules say; the connector's own
# `iceberg.security=read_only` denies them, CALL procedures, DDL and DML for every user on this catalog.
# Keep every other key equal to lake.properties (tests/unit/test_trino_access.py checks it).
# https://trino.io/docs/483/connector/iceberg.html#security
connector.name=iceberg
iceberg.security=read_only
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:LAKEKEEPER_URI}
iceberg.rest-catalog.warehouse=${ENV:LAKEKEEPER_WAREHOUSE}
iceberg.rest-catalog.vended-credentials-enabled=false

fs.s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
