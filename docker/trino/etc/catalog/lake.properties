# The same Iceberg JDBC catalog Spark writes (ADR-005). catalog-name must match Spark's catalog
# name, because JdbcCatalog keys every table row in postgres-meta by it.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres-meta:5432/${ENV:CATALOG_DB}
iceberg.jdbc-catalog.connection-user=${ENV:META_USER}
iceberg.jdbc-catalog.connection-password=${ENV:META_PASSWORD}
iceberg.jdbc-catalog.catalog-name=lake
iceberg.jdbc-catalog.default-warehouse-dir=s3a://${ENV:S3_BUCKET}/warehouse

fs.s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
