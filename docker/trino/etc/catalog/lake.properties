# The Iceberg REST catalog Lakekeeper, the one Spark writes (ADR-005). On this catalog DROP TABLE
# and unregister_table delete the table's files: OPERATIONS.md, "What deletes files".
# Trino uses its own S3 keys below: no vended credentials, no remote signing.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:LAKEKEEPER_URI}
iceberg.rest-catalog.warehouse=${ENV:LAKEKEEPER_WAREHOUSE}
iceberg.rest-catalog.vended-credentials-enabled=false

fs.s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
