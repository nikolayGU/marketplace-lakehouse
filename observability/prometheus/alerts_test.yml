# promtool test rules (make alerts-test). The failure cases come first: what must not fire.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # A live slot holds more than 64 MiB after three days at 24 MB a day: no alert.
  - interval: 1m
    input_series:
      - series: 'lakehouse_slot_retained_bytes{slot_name="shop_slot"}'
        values: '25000000+16667x4320'
      - series: 'lakehouse_slot_active{slot_name="shop_slot"}'
        values: '1+0x4320'
    alert_rule_test:
      - eval_time: 3d
        alertname: SlotWalRetainedHigh
        exp_alerts: []

  # A dead consumer with 70 MiB: fires once the 5 minutes of `for` have passed.
  - interval: 1m
    input_series:
      - series: 'lakehouse_slot_retained_bytes{slot_name="shop_slot"}'
        values: '73400320+0x10'
      - series: 'lakehouse_slot_active{slot_name="shop_slot"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: SlotWalRetainedHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: SlotWalRetainedHigh
        exp_alerts:
          - exp_labels:
              severity: page
              slot_name: shop_slot

  # Even an active slot over 512 MiB fires.
  - interval: 1m
    input_series:
      - series: 'lakehouse_slot_retained_bytes{slot_name="shop_slot"}'
        values: '600000000+0x10'
      - series: 'lakehouse_slot_active{slot_name="shop_slot"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: SlotWalRetainedHigh
        exp_alerts:
          - exp_labels:
              severity: page
              slot_name: shop_slot

  # An active slot on an idle source grows from 60 MiB and never drops: quiet until the whole hour
  # is above 64 MiB (the rise crosses it at minute 21), then it fires with no `for`.
  - interval: 15s
    input_series:
      - series: 'lakehouse_slot_retained_bytes{slot_name="shop_slot"}'
        values: '62914560+50000x720'
      - series: 'lakehouse_slot_active{slot_name="shop_slot"}'
        values: '1+0x720'
    alert_rule_test:
      - eval_time: 30m
        alertname: SlotWalHeldIdle
        exp_alerts: []
      - eval_time: 75m
        alertname: SlotWalHeldIdle
        exp_alerts: []
      - eval_time: 85m
        alertname: SlotWalHeldIdle
        exp_alerts:
          - exp_labels:
              severity: warn
              slot_name: shop_slot

  # Traffic moves the slot: the retained bytes saw from 60 to 65 MiB every 15 minutes, so the
  # hourly minimum stays under 64 MiB even where the value is above 64 MiB (minutes 13, 73, 118).
  - interval: 15s
    input_series:
      - series: 'lakehouse_slot_retained_bytes{slot_name="shop_slot"}'
        values: >-
          62914560+95000x59 62914560+95000x59 62914560+95000x59 62914560+95000x59
          62914560+95000x59 62914560+95000x59 62914560+95000x59 62914560+95000x59
      - series: 'lakehouse_slot_active{slot_name="shop_slot"}'
        values: '1+0x480'
    alert_rule_test:
      - eval_time: 13m
        alertname: SlotWalHeldIdle
        exp_alerts: []
      - eval_time: 73m
        alertname: SlotWalHeldIdle
        exp_alerts: []
      - eval_time: 118m
        alertname: SlotWalHeldIdle
        exp_alerts: []

  # A series that appeared 10 minutes ago above 64 MiB (a fresh Prometheus, a host that slept) has
  # not been above it for an hour: the window holds too few samples to claim it.
  - interval: 15s
    input_series:
      - series: 'lakehouse_slot_retained_bytes{slot_name="shop_slot"}'
        values: '73400320+0x40'
      - series: 'lakehouse_slot_active{slot_name="shop_slot"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: SlotWalHeldIdle
        exp_alerts: []

  # An active slot over 512 MiB is SlotWalRetainedHigh's (tested above): no second alert.
  - interval: 15s
    input_series:
      - series: 'lakehouse_slot_retained_bytes{slot_name="shop_slot"}'
        values: '600000000+0x480'
      - series: 'lakehouse_slot_active{slot_name="shop_slot"}'
        values: '1+0x480'
    alert_rule_test:
      - eval_time: 90m
        alertname: SlotWalHeldIdle
        exp_alerts: []

  # An inactive slot with 70 MiB for an hour is SlotWalRetainedHigh's too, not this alert's.
  - interval: 15s
    input_series:
      - series: 'lakehouse_slot_retained_bytes{slot_name="shop_slot"}'
        values: '73400320+0x480'
      - series: 'lakehouse_slot_active{slot_name="shop_slot"}'
        values: '0+0x480'
    alert_rule_test:
      - eval_time: 90m
        alertname: SlotWalHeldIdle
        exp_alerts: []

  # Stale tables with nothing waiting to be merged are no traffic, not a fault.
  - interval: 1m
    input_series:
      - series: 'lakehouse_table_freshness_seconds{layer="silver",table="orders"}'
        values: '7200+0x10'
      - series: 'lakehouse_silver_lag_seconds'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: FreshnessAbove15m
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'lakehouse_silver_lag_seconds'
        values: '0 0 1000 1000'
    alert_rule_test:
      - eval_time: 3m
        alertname: FreshnessAbove15m
        exp_alerts:
          - exp_labels:
              severity: warn

  # The first failure after statsd-exporter started: the series is born with the value 1.
  - interval: 1m
    input_series:
      - series: 'airflow_dagrun_failed_seconds_count{dag_id="dbt_build"}'
        values: '_ _ _ _ _ 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: AirflowDagFailed
        exp_alerts: []
      - eval_time: 8m
        alertname: AirflowDagFailed
        exp_alerts:
          - exp_labels:
              severity: warn
              dag_id: dbt_build

  # The driver died: the series goes stale and the absent() rule fires after its 5 minutes.
  - interval: 1m
    input_series:
      - series: 'spark_streaming_last_batch_timestamp{query="bronze_cdc_ingest"}'
        values: '0 0 0 stale'
    alert_rule_test:
      - eval_time: 6m
        alertname: SparkNoBatch5m
        exp_alerts: []
      - eval_time: 10m
        alertname: SparkNoBatch5m
        exp_alerts:
          - exp_labels:
              severity: page
              cause: gone
              query: bronze_cdc_ingest

  # A query that is alive but stuck: the timestamp stays at 0, so time() is far past it.
  - interval: 1m
    input_series:
      - series: 'spark_streaming_last_batch_timestamp{query="bronze_cdc_ingest"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: SparkNoBatch5m
        exp_alerts:
          - exp_labels:
              severity: page
              cause: stuck
              query: bronze_cdc_ingest

  # A planned single restart is not a loop: SparkRestartLoop stays quiet (ContainerRestarting
  # still fires, as it should). Two restarts in 10 minutes are still under the threshold.
  - interval: 1m
    input_series:
      - series: 'docker_container_start_time_seconds{name="lakehouse-spark-bronze-1",service="spark-bronze"}'
        values: '100 100 100 200 200 200'
    alert_rule_test:
      - eval_time: 5m
        alertname: SparkRestartLoop
        exp_alerts: []
      - eval_time: 5m
        alertname: ContainerRestarting
        exp_alerts:
          - exp_labels:
              severity: warn
              name: lakehouse-spark-bronze-1
              service: spark-bronze

  - interval: 1m
    input_series:
      - series: 'docker_container_start_time_seconds{name="lakehouse-spark-bronze-1",service="spark-bronze"}'
        values: '100 100 200 200 300 300'
    alert_rule_test:
      - eval_time: 5m
        alertname: SparkRestartLoop
        exp_alerts: []

  # A slow loop, one restart every 3 minutes, is 3 changes in 10 minutes: only the 10-minute window
  # sees it (a 5-minute window holds one or two).
  - interval: 1m
    input_series:
      - series: 'docker_container_start_time_seconds{name="lakehouse-spark-bronze-1",service="spark-bronze"}'
        values: '100 100 100 200 200 200 300 300 300 400 400 400 500'
    alert_rule_test:
      - eval_time: 10m
        alertname: SparkRestartLoop
        exp_alerts:
          - exp_labels:
              severity: page
              name: lakehouse-spark-bronze-1
              service: spark-bronze

  # Kafka is down and the driver restarts every 20 seconds, 15 times in 5 minutes.
  - interval: 20s
    input_series:
      - series: 'docker_container_start_time_seconds{name="lakehouse-spark-bronze-1",service="spark-bronze"}'
        values: '1+1x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: SparkRestartLoop
        exp_alerts:
          - exp_labels:
              severity: page
              name: lakehouse-spark-bronze-1
              service: spark-bronze

  # The same loop seen from the batch gauge: the driver's series goes stale at 130 s and never comes
  # back, because it dies before the first batch. At 420 s (4 min 50 s later) the `gone` rule is
  # still pending its 5 minutes and stays quiet, while the loop has restarted 15 times and fires.
  - interval: 10s
    input_series:
      - series: 'spark_streaming_last_batch_timestamp{query="bronze_cdc_ingest"}'
        values: '0x12 stale'
      - series: 'docker_container_start_time_seconds{name="lakehouse-spark-bronze-1",service="spark-bronze"}'
        values: '100x12 200x1 300x1 400x1 500x1 600x1 700x1 800x1 900x1 1000x1 1100x1 1200x1 1300x1 1400x1 1500x1 1600x1'
    alert_rule_test:
      - eval_time: 7m
        alertname: SparkNoBatch5m
        exp_alerts: []
      - eval_time: 7m
        alertname: SparkRestartLoop
        exp_alerts:
          - exp_labels:
              severity: page
              name: lakehouse-spark-bronze-1
              service: spark-bronze

  # lakekeeper-bootstrap runs again on every make start: no alert. Kafka restarting: alert.
  - interval: 1m
    input_series:
      - series: 'docker_container_start_time_seconds{name="lakehouse-lakekeeper-bootstrap-1"}'
        values: '100 100 200 200'
      - series: 'docker_container_start_time_seconds{name="lakehouse-kafka-1"}'
        values: '100 100 200 200'
    alert_rule_test:
      - eval_time: 3m
        alertname: ContainerRestarting
        exp_alerts:
          - exp_labels:
              severity: warn
              name: lakehouse-kafka-1

  # The connector task is running, then gone.
  - interval: 1m
    input_series:
      - series: 'kafka_connect_connector_task_status{connector="shop-connector",task="0",status="running"}'
        values: '1 1 1 1 stale'
    alert_rule_test:
      - eval_time: 3m
        alertname: ConnectorNotRunning
        exp_alerts: []
      - eval_time: 7m
        alertname: ConnectorNotRunning
        exp_alerts:
          - exp_labels:
              severity: page

  # The lag is sent, then dq_checks stops sending it: the TTL drops the series, the alert fires
  # 15 minutes later.
  - interval: 1m
    input_series:
      - series: 'lakehouse_silver_lag_seconds{instance="statsd-exporter:9102",job="statsd-exporter"}'
        values: '0x5 stale'
    alert_rule_test:
      - eval_time: 5m
        alertname: FreshnessAbove15m
        exp_alerts: []
      - eval_time: 22m
        alertname: FreshnessAbove15m
        exp_alerts:
          - exp_labels:
              severity: warn
              cause: unknown

  # dq_checks stamped its run 10 minutes ago: quiet. 31 minutes ago: stale.
  - interval: 1m
    input_series:
      - series: 'lakehouse_dq_last_run_timestamp_seconds{job="statsd-exporter"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: DqChecksStale
        exp_alerts: []
      - eval_time: 31m
        alertname: DqChecksStale
        exp_alerts:
          - exp_labels:
              severity: warn
              cause: stale
              job: statsd-exporter

  # No stamp at all: gone after 15 minutes.
  - interval: 1m
    input_series:
      - series: 'up{job="statsd-exporter"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: DqChecksStale
        exp_alerts: []
      - eval_time: 16m
        alertname: DqChecksStale
        exp_alerts:
          - exp_labels:
              severity: warn
              cause: gone

  # A core target down for 3 minutes fires; the stateful job, off by default, does not.
  - interval: 1m
    input_series:
      - series: 'up{job="postgres-exporter",instance="postgres-exporter:9187"}'
        values: '1 0 0 0 0'
      - series: 'up{job="spark-orders-per-minute",instance="spark-orders-per-minute:4041"}'
        values: '0 0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 4m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels:
              severity: warn
              job: postgres-exporter
              instance: postgres-exporter:9187

  # Across the TTL: the stamp stops at minute 0, statsd-exporter drops the series at minute 45.
  # The stale alert must not go quiet before the gone alert fires.
  - interval: 1m
    input_series:
      - series: 'lakehouse_dq_last_run_timestamp_seconds{job="statsd-exporter"}'
        values: '0+0x45 stale'
      - series: 'lakehouse_silver_lag_seconds{job="statsd-exporter"}'
        values: '1000+0x45 stale'
    alert_rule_test:
      - eval_time: 52m
        alertname: DqChecksStale
        exp_alerts:
          - exp_labels:
              severity: warn
              cause: stale
              job: statsd-exporter
      - eval_time: 52m
        alertname: FreshnessAbove15m
        exp_alerts:
          - exp_labels:
              severity: warn
              job: statsd-exporter
      - eval_time: 62m
        alertname: DqChecksStale
        exp_alerts:
          - exp_labels:
              severity: warn
              cause: stale
              job: statsd-exporter
          - exp_labels:
              severity: warn
              cause: gone

  # The lag came back to 0: the alert goes quiet with the next value, not an hour later.
  - interval: 1m
    input_series:
      - series: 'lakehouse_silver_lag_seconds{job="statsd-exporter"}'
        values: '1000x5 0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: FreshnessAbove15m
        exp_alerts:
          - exp_labels:
              severity: warn
              job: statsd-exporter
      - eval_time: 8m
        alertname: FreshnessAbove15m
        exp_alerts: []
