# The six alerts of week 4 (W4-T05), plus the alerts on a source that went silent (review of W4
# and W5): a gauge that stops coming must not read as "all quiet". Week 6 adds SlotWalHeldIdle
# (W6-T05) and SparkRestartLoop (W6-T06). No Alertmanager (W4-D6): state
# is read from the Prometheus UI, /api/v1/alerts and the Pipeline health dashboard. Tests: alerts_test.yml (make alerts-test);
# live proof per alert: OPERATIONS.md, "Observability".
groups:
  - name: lakehouse
    rules:
      # absent() also fires when the source is off: with obs up and core down this one burns.
      - alert: ConnectorNotRunning
        expr: absent(kafka_connect_connector_task_status{connector="shop-connector",status="running"} == 1)
        for: 1m
        labels:
          severity: page

      # An inactive slot over 64 MiB is a consumer that is gone; any slot over 512 MiB fills the
      # disk even with one (W4-D3). A live slot holds ~25 MB of WAL on an idle laptop.
      - alert: SlotWalRetainedHigh
        expr: >-
          (lakehouse_slot_retained_bytes{slot_name="shop_slot"} > 64 * 1024 * 1024
            and on (slot_name) lakehouse_slot_active == 0)
          or lakehouse_slot_retained_bytes{slot_name="shop_slot"} > 512 * 1024 * 1024
        for: 5m
        labels:
          severity: page

      # An active slot above 64 MiB for a whole hour on an idle source: the slot moves only when
      # the source writes (a healthy one holds ~24 MB after a day idle), so traffic drops it under
      # 64 MiB within the hour. At least 200 samples (scrape 15s, 240 an hour) keep a short history
      # from passing as a whole hour. An inactive slot and one over 512 MiB belong to the rule above.
      - alert: SlotWalHeldIdle
        expr: >-
          min_over_time(lakehouse_slot_retained_bytes{slot_name="shop_slot"}[1h]) > 64 * 1024 * 1024
          and on (slot_name) count_over_time(lakehouse_slot_retained_bytes{slot_name="shop_slot"}[1h]) >= 200
          and on (slot_name) lakehouse_slot_active == 1
          and on (slot_name) lakehouse_slot_retained_bytes{slot_name="shop_slot"} <= 512 * 1024 * 1024
        labels:
          severity: warn

      # Idle events keep the timestamp moving, so only a stuck or dead query trips this.
      - alert: SparkNoBatch5m
        expr: time() - spark_streaming_last_batch_timestamp{query="bronze_cdc_ingest"} > 300
        labels:
          severity: page
          cause: stuck
      # The driver died: its series is gone, and the rule above has nothing to compare.
      - alert: SparkNoBatch5m
        expr: absent(spark_streaming_last_batch_timestamp{query="bronze_cdc_ingest"})
        for: 5m
        labels:
          severity: page
          cause: gone

      # A driver that restarts every few seconds (Kafka stopped, OffsetOutOfRange) dies before its
      # first batch, so the rules above are still inside their 5 minutes: the restarts are the signal.
      - alert: SparkRestartLoop
        expr: changes(docker_container_start_time_seconds{name="lakehouse-spark-bronze-1"}[10m]) > 2
        labels:
          severity: page

      # The age of the oldest bronze snapshot silver has not merged (W4-D4); 0 at rest. Table
      # freshness is "no traffic" between replay bursts and does not alert.
      # last_over_time: the last value holds for an hour after statsd-exporter dropped the series
      # (TTL 45m), so this keeps firing until the absent() rule below takes over.
      - alert: FreshnessAbove15m
        expr: last_over_time(lakehouse_silver_lag_seconds[1h]) > 900
        labels:
          severity: warn
      # dq_checks sends no lag when it cannot tell it (no Variable, the snapshot is gone), and
      # statsd-exporter drops a gauge 45 minutes after its last value: without the series the rule
      # above stays quiet whatever the lag.
      - alert: FreshnessAbove15m
        expr: absent(lakehouse_silver_lag_seconds)
        for: 15m
        labels:
          severity: warn
          cause: unknown

      # dq_checks runs every 15 minutes and stamps the end of each run; a paused DAG, a stopped
      # scheduler or a failing task stops the stamp, and with it every lakehouse_dq_* gauge. The
      # stale rule fires from minute 30 and, through last_over_time, past the TTL drop at minute
      # 45 until the gone rule fires at minute 60: no gap between them.
      - alert: DqChecksStale
        expr: time() - last_over_time(lakehouse_dq_last_run_timestamp_seconds[1h]) > 1800
        labels:
          severity: warn
          cause: stale
      - alert: DqChecksStale
        expr: absent(lakehouse_dq_last_run_timestamp_seconds)
        for: 15m
        labels:
          severity: warn
          cause: gone

      # A target Prometheus cannot scrape: its own alerts go quiet with it (ADR-023). The stateful
      # job runs only with PROFILE=stateful, so its target is down by design otherwise.
      - alert: ScrapeTargetDown
        expr: up{job!="spark-orders-per-minute"} == 0
        for: 2m
        labels:
          severity: warn

      # increase() misses the first value of a new counter series, so the second half catches the
      # first failure after statsd-exporter started.
      - alert: AirflowDagFailed
        expr: >-
          increase(airflow_dagrun_failed_seconds_count[30m]) > 0
          or (airflow_dagrun_failed_seconds_count unless airflow_dagrun_failed_seconds_count offset 30m)
        labels:
          severity: warn

      # docker restart moves the start time; RestartCount only follows the restart policy
      # (ADR-023). One-shot containers run again on every make start.
      - alert: ContainerRestarting
        expr: >-
          changes(docker_container_start_time_seconds{
            name=~"lakehouse-.+", name!~".*-init-.*", name!~".*-bootstrap-.*", name!~".*-migrate-.*"
          }[15m]) > 0
        labels:
          severity: warn
