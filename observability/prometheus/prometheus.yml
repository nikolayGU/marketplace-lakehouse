global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

# Every target sits on the compose network `lake`; exporters publish no host ports.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: spark-bronze
    static_configs:
      - targets: ["spark-bronze:4041"]
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: statsd-exporter
    static_configs:
      - targets: ["statsd-exporter:9102"]
  - job_name: container-exporter
    static_configs:
      - targets: ["container-exporter:9105"]
