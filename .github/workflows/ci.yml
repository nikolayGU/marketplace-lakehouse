name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy oltp streaming airflow/dags tests
      - run: uv run yamllint -c .yamllint docker observability airflow .github
      - run: uv run sqlfluff lint dbt/models oltp/migrations
      - run: uv run pytest tests/unit -q
      - name: dbt parse
        run: cd dbt && uv run dbt parse --profiles-dir . --target ci
      - name: compose config
        run: cp .env.example .env && docker compose --env-file .env -f docker/compose.yaml --profile '*' config -q
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build spark image
        uses: docker/build-push-action@v6
        with:
          context: streaming
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build airflow image
        uses: docker/build-push-action@v6
        with:
          context: airflow
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # smoke: manual/nightly, boots `core`, replays 60 s, asserts bronze rows via trino cli. Week 5.
