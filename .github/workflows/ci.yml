name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read the repo; gitleaks-action lists the commits of a pull request through the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The same image, by the same digest, as postgres-oltp in docker/compose.yaml: the reconcile
    # queries of the source side run on it (tests/unit/test_reconcile_postgres.py). A throwaway
    # server: on a laptop RECONCILE_TEST_DSN must never point at the Postgres of the stack
    # (postgres-oltp, localhost:5432).
    services:
      postgres:
        image: postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
        env:
          POSTGRES_PASSWORD: reconcile-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # gitleaks-action scans the commit range, which a shallow clone cannot resolve.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          # The uv that writes uv.lock; without a version setup-uv takes the latest.
          version: "0.12.17"
      # Spark 3.5.9 fails on the newer default JDK of ubuntu-26.04 (getSubject is not supported).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "17"
          distribution: temurin
      - run: uv sync --locked --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: for script in $(git ls-files '*.sh'); do bash -n "$script" || exit 1; done
      - run: uv run shellcheck -x -S warning $(git ls-files '*.sh')
      - run: uv run mypy
      - run: uv run yamllint -c .yamllint docker observability airflow .github
      - run: uv run sqlfluff lint oltp/migrations
      # dbt/.sqlfluff switches to the jinja templater, which sqlfluff takes only from the
      # working directory.
      - run: uv run sqlfluff lint models macros tests
        working-directory: dbt
      - run: make dbt-parse
      - run: uv run pytest tests/unit -q
      # FAIL_ON_SKIP (tests/unit/conftest.py) turns a skip into a failure: a wrong DSN must not
      # leave the Postgres side of reconcile unrun and the job green.
      - run: uv run pytest tests/unit/test_reconcile_postgres.py -q
        env:
          FAIL_ON_SKIP: "1"
          RECONCILE_TEST_DSN: postgresql://postgres:reconcile-test@localhost:5432/postgres
      - name: compose config
        run: cp .env.example .env && docker compose --env-file .env -f docker/compose.yaml --profile '*' config -q
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - airflow/Dockerfile
          - docker/connect/Dockerfile
          - docker/minio/Dockerfile
          - docker/superset/Dockerfile
          - observability/container-exporter/Dockerfile
          - oltp/Dockerfile
          - streaming/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning

  # promtool checks observability/prometheus/alerts.yml and runs alerts_test.yml in the pinned
  # Prometheus image (neither `make check` nor another job runs it).
  alerts-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: make alerts-test

  # The Spark tests of MERGE, quarantine and epoch skipping need the Iceberg jar, which only the
  # image has: pytest on the runner skips them. `make test-spark` sets FAIL_ON_SKIP=1
  # (tests/unit/conftest.py), which turns any skip into a failure, so green here means they ran.
  spark-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: streaming
          build-contexts: contracts=contracts
          tags: lakehouse/spark:ci
          load: true
          cache-from: type=gha,scope=spark
          cache-to: type=gha,mode=max,scope=spark
      - run: make test-spark SPARK_IMAGE=lakehouse/spark:ci

  airflow-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: airflow
          tags: lakehouse/airflow:ci
          load: true
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
      - name: the image imports what the DAGs need
        run: docker run --rm --entrypoint python lakehouse/airflow:ci -c "import airflow, trino, psycopg, pydantic_settings"
      - name: dbt is in its own venv
        run: docker run --rm --entrypoint /opt/dbt-venv/bin/dbt lakehouse/airflow:ci --version
      # The unit tests read the DAG files without Airflow; this imports them in the real image,
      # with its Jinja and its mapping rules.
      - name: every DAG imports in the image
        run: make dags-check AIRFLOW_IMAGE=lakehouse/airflow:ci

  # ADR-026: no registry serves MinIO and mc, so they are built from the source of their tags.
  # The check runs the built images: the release and the commit they print, sh and wget, MinIO
  # healthy on the compose healthcheck, create-bucket.sh (minio-init) twice.
  minio-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/minio
          target: minio
          tags: lakehouse/minio:ci
          load: true
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/minio
          target: mc
          tags: lakehouse/mc:ci
          load: true
          cache-from: type=gha,scope=mc
          cache-to: type=gha,mode=max,scope=mc
      - name: the images do what compose needs
        run: bash scripts/check-minio-images.sh lakehouse/minio:ci lakehouse/mc:ci

# smoke: smoke.yml.
