name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read the repo; gitleaks-action lists the commits of a pull request through the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks-action scans the commit range, which a shallow clone cannot resolve.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: for script in $(git ls-files '*.sh'); do bash -n "$script" || exit 1; done
      - run: uv run mypy
      - run: uv run yamllint -c .yamllint docker observability airflow .github
      - run: uv run sqlfluff lint oltp/migrations
      # dbt/.sqlfluff switches to the jinja templater, which sqlfluff takes only from the
      # working directory.
      - run: uv run sqlfluff lint models macros tests
        working-directory: dbt
      - run: make dbt-parse
      - run: uv run pytest tests/unit -q
      - name: compose config
        run: cp .env.example .env && docker compose --env-file .env -f docker/compose.yaml --profile '*' config -q
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - airflow/Dockerfile
          - docker/connect/Dockerfile
          - docker/minio/Dockerfile
          - observability/container-exporter/Dockerfile
          - oltp/Dockerfile
          - streaming/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning

  # promtool checks observability/prometheus/alerts.yml and runs alerts_test.yml in the pinned
  # Prometheus image (QA-01: neither `make check` nor another job runs it).
  alerts-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make alerts-test

  # The Spark tests of MERGE, quarantine and epoch skipping need the Iceberg jar, which only the
  # image has: pytest on the runner skips them. `make test-spark` sets FAIL_ON_SKIP=1
  # (tests/unit/conftest.py), which turns any skip into a failure, so green here means they ran.
  spark-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: streaming
          build-contexts: contracts=contracts
          tags: lakehouse/spark:ci
          load: true
          cache-from: type=gha,scope=spark
          cache-to: type=gha,mode=max,scope=spark
      - run: make test-spark SPARK_IMAGE=lakehouse/spark:ci

  airflow-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: airflow
          tags: lakehouse/airflow:ci
          load: true
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
      - name: the image imports what the DAGs need
        run: docker run --rm --entrypoint python lakehouse/airflow:ci -c "import airflow, trino, psycopg, pydantic_settings"
      - name: dbt is in its own venv
        run: docker run --rm --entrypoint /opt/dbt-venv/bin/dbt lakehouse/airflow:ci --version
      # The unit tests read the DAG files without Airflow; this imports them in the real image,
      # with its Jinja and its mapping rules.
      - name: every DAG imports in the image
        run: make dags-check AIRFLOW_IMAGE=lakehouse/airflow:ci

  # ADR-026: no registry serves MinIO and mc, so they are built from the source of their tags.
  # The check runs the built images: the release and the commit they print, sh and wget, MinIO
  # healthy on the compose healthcheck, create-bucket.sh (minio-init) twice.
  minio-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/minio
          target: minio
          tags: lakehouse/minio:ci
          load: true
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/minio
          target: mc
          tags: lakehouse/mc:ci
          load: true
          cache-from: type=gha,scope=mc
          cache-to: type=gha,mode=max,scope=mc
      - name: the images do what compose needs
        run: bash scripts/check-minio-images.sh lakehouse/minio:ci lakehouse/mc:ci

# smoke: smoke.yml (W5-T03).
