name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action scans the commit range, which a shallow clone cannot resolve.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run yamllint -c .yamllint docker observability airflow .github
      # dbt/models is still empty, and git does not carry empty directories, so a fresh
      # checkout has no such path. Lint whatever SQL directories the checkout actually has.
      - name: sqlfluff
        run: |
          paths=$(ls -d dbt/models oltp/migrations 2>/dev/null || true)
          [ -n "$paths" ] && uv run sqlfluff lint $paths || echo "no SQL directories yet"
      - run: uv run pytest tests/unit -q
      - name: compose config
        run: cp .env.example .env && docker compose --env-file .env -f docker/compose.yaml --profile '*' config -q
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Re-enable as the pieces land: `dbt parse` with W3-T01, the spark and airflow image
# builds with W1-T06 and W3-T04, hadolint with W5-T02.
# smoke: manual/nightly, boots `core`, replays 60 s, asserts bronze rows via trino cli. Week 5.
