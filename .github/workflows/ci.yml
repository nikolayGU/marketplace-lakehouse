name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read the repo; gitleaks-action lists the commits of a pull request through the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action scans the commit range, which a shallow clone cannot resolve.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: for script in $(git ls-files '*.sh'); do bash -n "$script" || exit 1; done
      - run: uv run mypy
      - run: uv run yamllint -c .yamllint docker observability airflow .github
      - run: uv run sqlfluff lint oltp/migrations
      # dbt/.sqlfluff switches to the jinja templater, which sqlfluff takes only from the
      # working directory.
      - run: uv run sqlfluff lint models macros tests
        working-directory: dbt
      - run: make dbt-parse
      - run: uv run pytest tests/unit -q
      - name: compose config
        run: cp .env.example .env && docker compose --env-file .env -f docker/compose.yaml --profile '*' config -q
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - airflow/Dockerfile
          - docker/connect/Dockerfile
          - observability/container-exporter/Dockerfile
          - oltp/Dockerfile
          - streaming/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning

  # The Spark tests of MERGE, quarantine and epoch skipping need the Iceberg jar, which only the
  # image has: pytest on the runner skips them. `make test-spark` sets FAIL_ON_SKIP=1
  # (tests/unit/conftest.py), which turns any skip into a failure, so green here means they ran.
  spark-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: streaming
          build-contexts: contracts=contracts
          tags: lakehouse/spark:ci
          load: true
          cache-from: type=gha,scope=spark
          cache-to: type=gha,mode=max,scope=spark
      - run: make test-spark SPARK_IMAGE=lakehouse/spark:ci

  airflow-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: airflow
          tags: lakehouse/airflow:ci
          load: true
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
      - name: the image imports what the DAGs need
        run: docker run --rm --entrypoint python lakehouse/airflow:ci -c "import airflow, trino, psycopg, pydantic_settings"
      - name: dbt is in its own venv
        run: docker run --rm --entrypoint /opt/dbt-venv/bin/dbt lakehouse/airflow:ci --version
      # The unit tests read the DAG files without Airflow; this imports them in the real image,
      # with its Jinja and its mapping rules.
      - name: every DAG imports in the image
        run: make dags-check AIRFLOW_IMAGE=lakehouse/airflow:ci

# smoke: smoke.yml (W5-T03).
