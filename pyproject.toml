[project]
name = "marketplace-lakehouse-mini"
version = "0.1.0"
description = "Mini production-like data platform: CDC -> Kafka -> Spark -> Iceberg -> Trino -> dbt"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.17",
    "pytest>=8.4",
    "yamllint>=1.37",
    "sqlfluff>=3.4",
    "sqlfluff-templater-dbt>=3.4",
    "dbt-core>=1.10,<1.11",
    "dbt-trino>=1.10,<1.11",
    "pyspark==3.5.9",
    "pydantic-settings>=2.10",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.22",
    "pre-commit>=4.3",
    "kaggle>=2.2.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# mypy fails on a directory without .py files; add streaming and airflow/dags as they appear.
files = ["scripts", "tests", "oltp"]
# `replayer` is a top-level package inside oltp/, which is what the container sees too.
mypy_path = "oltp"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `replayer` lives in oltp/, same as inside the container image.
pythonpath = ["oltp", "."]
