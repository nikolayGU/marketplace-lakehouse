[project]
name = "marketplace-lakehouse-mini"
version = "0.1.0"
description = "Mini production-like data platform: CDC -> Kafka -> Spark -> Iceberg -> Trino -> dbt"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.17",
    "pytest>=8.4",
    "yamllint>=1.37",
    "sqlfluff>=3.4",
    "sqlfluff-templater-dbt>=3.4",
    "dbt-core>=1.10,<1.11",
    "dbt-trino>=1.10,<1.11",
    "pyspark==3.5.9",
    "pydantic-settings>=2.10",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.22",
    "pre-commit>=4.3",
    "kaggle>=2.2.4",
    "jsonschema>=4.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# PySpark idioms: `functions as F`, and listener callbacks whose camelCase names Spark dictates.
"streaming/**" = ["N802", "N812"]

[tool.ruff.lint.isort]
# The repo has an airflow/ directory; the package of that name is the installed library.
known-third-party = ["airflow"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# DAG files are left out: without Airflow on the host, mypy cannot type them.
files = ["scripts", "tests", "oltp", "streaming", "airflow/dags/lakehouse", "observability/container-exporter"]
# `replayer`, `spark_jobs`, `lakehouse` and `container_exporter` are top-level packages, as their
# containers see them.
mypy_path = "oltp:streaming:airflow/dags:observability/container-exporter"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `replayer` lives in oltp/, `spark_jobs` in streaming/, `lakehouse` in airflow/dags/, as in the images.
pythonpath = ["oltp", "streaming", "airflow/dags", "observability/container-exporter", "."]
